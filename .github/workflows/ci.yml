name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Type check
        run: |
          python -m pyright --pythonpath "$(command -v python)" apps lib workers scripts
          python -m mypy apps/api lib workers scripts
      - name: Unit tests
        run: python -m pytest -q tests/unit
      - name: Golden corpus checks
        run: python scripts/run_golden_corpus.py
      - name: Model corpus shape checks
        run: python scripts/run_model_corpus.py --manifest tests/fixtures/model_corpus/phase8_5_model_manifest.example.json
      - name: Static security checks
        run: |
          python -m bandit -r apps lib workers scripts
          semgrep scan --config auto --error --exclude archive

  integration:
    name: DB-backed integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: paradedb/paradedb:0.21.5-pg17
        env:
          POSTGRES_DB: structura
          POSTGRES_USER: structura
          POSTGRES_PASSWORD: structura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U structura -d structura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Run isolated integration tests
        env:
          STRUCTURA_INTEGRATION_BASE_DATABASE_URL: postgresql://structura:structura@localhost:5432/structura
        run: python scripts/run_integration_tests.py
      - name: Run backup restore rehearsal
        env:
          STRUCTURA_INTEGRATION_BASE_DATABASE_URL: postgresql://structura:structura@localhost:5432/structura
        run: python scripts/rehearse_backup_restore.py

  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and build
        run: |
          npm --workspace apps/web run lint
          npm --workspace apps/web run build

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose profiles
        run: |
          docker compose config -q
          docker compose --profile extraction --profile search --profile relationships --profile automation --profile visual --profile models-placeholder config -q
          docker compose --profile models-live config -q
          docker compose --profile visual-embed-live config -q
