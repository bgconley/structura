[project]
name = "structura"
version = "0.1.0"
description = "Local-first evidence-backed document workbench"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1",
  "email-validator>=2.0",
  "fastapi>=0.120",
  "jsonschema>=4.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "mypy>=1.8",
  "pyright>=1.1",
  "pytest>=8.0",
  "ruff>=0.8",
  "semgrep>=1.90",
  "types-jsonschema>=4.0",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "lib*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
