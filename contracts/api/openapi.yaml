openapi: 3.1.0
info:
  title: Structura API
  version: 0.1.3
  summary: Local-first AI-augmented document filing cabinet API
  description: 'This v1.3 API contract covers the core workbench surfaces needed
    for implementation convergence: auth/session, document ingest and detail,
    protected asset access, folders, tags, candidate/canonical review actions,
    relationships, contacts, filing rules, watched folders, search, analysis,
    exports, and job/admin inspection.

    '
servers:
- url: http://localhost:8000
  description: Local development
tags:
- name: Health
  description: Runtime health and version surfaces
- name: Auth
  description: Session and login surfaces
- name: Contracts
  description: Contract registry diagnostics
- name: Documents
- name: Search
- name: Review
- name: Analysis
- name: Organization
- name: Relationships
- name: Automation
- name: Assets
- name: Generation Evidence
- name: Exports
- name: Jobs
- name: Admin
security:
- sessionCookie: []
- apiToken: []
paths:
  /api/v1/upload-policy:
    get:
      tags:
      - Documents
      summary: Read configured upload bounds and signature policy
      responses:
        '200':
          description: Exact authorized upload observation; acceptance is independent of processing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPolicyRead'
        '401':
          description: Authentication required.
        '403':
          description: Current credential or document permission denied.
        '404':
          description: Upload or selected original unavailable.
        '408':
          description: Bounded transfer timed out; reconcile before retry.
        '409':
          description: Revision, generation, decision or content replay conflicts.
        '413':
          description: Actual body exceeds its bound.
        '415':
          description: Unrecognized signature or signature/metadata mismatch.
        '422':
          description: Invalid command or byte count.
        '429':
          description: Reserved transfer or staging capacity occupied.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying admission.
        '503':
          description: Upload storage or service unavailable.
  /api/v1/uploads:
    post:
      tags:
      - Documents
      summary: Create or recover an actor-scoped immutable upload operation
      responses:
        '200':
          description: Exact authorized upload observation; acceptance is independent of processing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAttempt'
        '401':
          description: Authentication required.
        '403':
          description: Current credential or document permission denied.
        '404':
          description: Upload or selected original unavailable.
        '408':
          description: Bounded transfer timed out; reconcile before retry.
        '409':
          description: Revision, generation, decision or content replay conflicts.
        '413':
          description: Actual body exceeds its bound.
        '415':
          description: Unrecognized signature or signature/metadata mismatch.
        '422':
          description: Invalid command or byte count.
        '429':
          description: Reserved transfer or staging capacity occupied.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying admission.
        '503':
          description: Upload storage or service unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
  /api/v1/uploads/{uploadId}:
    get:
      tags:
      - Documents
      summary: Reconcile an exact upload under current credential and document ACL
      responses:
        '200':
          description: Exact authorized upload observation; acceptance is independent of processing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAttempt'
        '401':
          description: Authentication required.
        '403':
          description: Current credential or document permission denied.
        '404':
          description: Upload or selected original unavailable.
        '408':
          description: Bounded transfer timed out; reconcile before retry.
        '409':
          description: Revision, generation, decision or content replay conflicts.
        '413':
          description: Actual body exceeds its bound.
        '415':
          description: Unrecognized signature or signature/metadata mismatch.
        '422':
          description: Invalid command or byte count.
        '429':
          description: Reserved transfer or staging capacity occupied.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying admission.
        '503':
          description: Upload storage or service unavailable.
    delete:
      tags:
      - Documents
      summary: Cancel an unaccepted operation or return its committed receipt
      responses:
        '200':
          description: Exact authorized upload observation; acceptance is independent of processing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAttempt'
        '401':
          description: Authentication required.
        '403':
          description: Current credential or document permission denied.
        '404':
          description: Upload or selected original unavailable.
        '408':
          description: Bounded transfer timed out; reconcile before retry.
        '409':
          description: Revision, generation, decision or content replay conflicts.
        '413':
          description: Actual body exceeds its bound.
        '415':
          description: Unrecognized signature or signature/metadata mismatch.
        '422':
          description: Invalid command or byte count.
        '429':
          description: Reserved transfer or staging capacity occupied.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying admission.
        '503':
          description: Upload storage or service unavailable.
    parameters:
    - in: path
      name: uploadId
      required: true
      schema:
        type: string
        format: uuid
  /api/v1/uploads/{uploadId}/content:
    put:
      tags:
      - Documents
      summary: Admit and stream exact raw file bytes; verify every accepted-content replay
      responses:
        '200':
          description: Exact authorized upload observation; acceptance is independent of processing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAttempt'
        '401':
          description: Authentication required.
        '403':
          description: Current credential or document permission denied.
        '404':
          description: Upload or selected original unavailable.
        '408':
          description: Bounded transfer timed out; reconcile before retry.
        '409':
          description: Revision, generation, decision or content replay conflicts.
        '413':
          description: Actual body exceeds its bound.
        '415':
          description: Unrecognized signature or signature/metadata mismatch.
        '422':
          description: Invalid command or byte count.
        '429':
          description: Reserved transfer or staging capacity occupied.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying admission.
        '503':
          description: Upload storage or service unavailable.
      parameters:
      - in: header
        name: If-Match
        required: true
        description: Exact current upload revision UUID.
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Replace-Transfer-ID
        required: false
        description: Explicitly replace this exact unfinished transfer ID using the current credential. Its outstanding storage stays reserved until cleanup.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
    parameters:
    - in: path
      name: uploadId
      required: true
      schema:
        type: string
        format: uuid
  /api/v1/uploads/{uploadId}/decision:
    post:
      tags:
      - Documents
      summary: Resolve the exact held duplicate with a fresh credential
      responses:
        '200':
          description: Exact authorized upload observation; acceptance is independent of processing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAttempt'
        '401':
          description: Authentication required.
        '403':
          description: Current credential or document permission denied.
        '404':
          description: Upload or selected original unavailable.
        '408':
          description: Bounded transfer timed out; reconcile before retry.
        '409':
          description: Revision, generation, decision or content replay conflicts.
        '413':
          description: Actual body exceeds its bound.
        '415':
          description: Unrecognized signature or signature/metadata mismatch.
        '422':
          description: Invalid command or byte count.
        '429':
          description: Reserved transfer or staging capacity occupied.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying admission.
        '503':
          description: Upload storage or service unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDecision'
    parameters:
    - in: path
      name: uploadId
      required: true
      schema:
        type: string
        format: uuid
  /api/v1/health:
    get:
      tags:
      - Health
      summary: API health summary
      security: []
      responses:
        '200':
          description: API health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHealthResponse'
  /api/v1/version:
    get:
      tags:
      - Health
      summary: API version
      security: []
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - service
                - version
                - api_contract_version
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  api_contract_version:
                    type: string
  /api/v1/contracts/summary:
    get:
      tags:
      - Contracts
      summary: Loaded contract registry summary
      security: []
      responses:
        '200':
          description: Contract registry summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/migrations/baseline:
    get:
      tags:
      - Admin
      summary: Baseline migration manifest
      security:
      - sessionCookie: []
      - apiToken: []
      responses:
        '200':
          description: Baseline migration manifest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - database_dir
                - scripts
                properties:
                  database_dir:
                    type: string
                  scripts:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
  /api/v1/auth/session:
    get:
      tags:
      - Auth
      summary: Get current session
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          description: Not authenticated
    post:
      tags:
      - Auth
      summary: Create a login session
      description: >-
        Browser requests require the configured Origin. Replacing an active
        cookie session also requires its bound X-CSRF-Token. Missing Origin is
        allowed only for non-browser clients without Fetch Metadata headers.
        Successful replacement revokes the previous session atomically.
      security: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: false
        description: Required when replacing an active browser session.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Authenticated session created
          headers:
            Set-Cookie:
              description: HttpOnly session cookie carrying the new session token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          description: Authentication failed
        '403':
          description: Browser origin or session-bound CSRF validation failed
    delete:
      tags:
      - Auth
      summary: End current session
      description: >-
        Requires the authenticated browser session and its bound CSRF secret.
        An API token cannot authorize cookie logout.
      security:
      - sessionCookie: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session ended
          headers:
            Set-Cookie:
              description: Session cookie cleared by expiring the current cookie value.
              schema:
                type: string
        '401':
          description: Not authenticated
        '403':
          description: Browser session, origin or session-bound CSRF required
  /api/v1/auth/magic-links:
    post:
      tags:
      - Auth
      summary: Request a magic link for bootstrap, invite, or recovery
      description: >-
        Acknowledges the request uniformly without revealing account existence.
        The current baseline has no email delivery adapter; acceptance does not
        promise delivery. Browser requests require the configured Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMagicLinkRequest'
      responses:
        '202':
          description: Request accepted; does not imply account existence or delivery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - accepted
                properties:
                  accepted:
                    type: boolean
        '403':
          description: Browser origin validation failed
  /api/v1/documents:
    get:
      tags:
      - Documents
      summary: List documents
      parameters:
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: family
        schema:
          type: string
      - in: query
        name: reviewStatus
        schema:
          type: string
      - in: query
        name: folderId
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
      - in: query
        name: inboxState
        description: State membership composes with all other list filters. Counts are computed before this state is applied.
        schema:
          type: string
          enum: [all, needs_review, unfiled, awaiting_classification, duplicates, low_confidence, has_extraction, text_searchable]
          default: all
      - in: query
        name: sort
        description: Deterministic order with a unique document ID tie-breaker. Unknown document dates sort last; title sorting uses normalized C collation. Offset pages do not freeze the corpus across requests.
        schema:
          type: string
          enum: [uploaded_desc, uploaded_asc, document_date_desc, document_date_asc, title_asc, title_desc]
          default: uploaded_desc
      responses:
        '200':
          description: Authorized document page and counts from one read-only repeatable-read database snapshot. Concurrent corpus changes may move records between subsequent offset-page requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          description: Not authenticated
        '403':
          description: Document read permission or household required
        '422':
          description: Invalid document browse option or pagination value
    post:
      tags:
      - Documents
      summary: Ingest a new document via multipart upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentMultipartRequest'
      responses:
        '202':
          description: Immutable original and document record accepted; exact documentId is available before background processing completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedDocumentUpload'
        '401':
          description: Not authenticated
  /api/v1/documents/{documentId}:
    get:
      tags:
      - Documents
      summary: Fetch a document detail view
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '401':
          description: Not authenticated
        '404':
          description: Document not found
  /api/v1/documents/{documentId}/semantic-annotations/current:
    get:
      tags:
      - Documents
      summary: Fetch the current semantic annotation manifest for a document
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: qualityMode
        schema:
          type: string
          enum:
          - smart
          default: smart
      responses:
        '200':
          description: Current semantic annotation manifest or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticAnnotationCurrentResponse'
        '401':
          description: Not authenticated
        '404':
          description: Document not found
  /api/v1/documents/{documentId}/parse-debug:
    get:
      tags:
      - Documents
      summary: Fetch protected canonical parse diagnostics for a document
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: pageLimit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: elementLimit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - in: query
        name: tableLimit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: chunkLimit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - in: query
        name: jobLimit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Canonical parse diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseDebugView'
        '401':
          description: Not authenticated
        '403':
          description: Admin access required
        '404':
          description: Document not found
  /api/v1/documents/{documentId}/review-actions:
    post:
      tags:
      - Review
      summary: Submit a human or agent review action
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewActionRequest'
      responses:
        '200':
          description: Review action applied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                  reviewEventId:
                    type: string
                    format: uuid
                  decision:
                    $ref: '#/components/schemas/FieldDecision'
                  canonical:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/CanonicalField'
                  projection:
                    $ref: '#/components/schemas/FieldProjectionRevision'
                  jobId:
                    type: string
                    format: uuid
        '409':
          description: Canonical revision changed or a human-reviewed fact requires
            an explicit revision
        '422':
          description: Invalid typed correction value
        '401':
          description: Not authenticated
  /api/v1/documents/{documentId}/field-candidates:
    get:
      tags:
      - Review
      summary: List candidate values for a document
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: fieldPath
        schema:
          type: string
      responses:
        '200':
          description: Field candidate list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldCandidate'
        '401':
          description: Not authenticated
  /api/v1/documents/{documentId}/observation-candidates:
    get:
      tags:
      - Review
      summary: List reviewable observation candidates for a document
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: observationId
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          description: Observation candidate list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservationCandidate'
        '401':
          description: Not authenticated
  /api/v1/documents/{documentId}/line-item-candidates:
    get:
      tags:
      - Review
      summary: Read exact line proposals with source eligibility and reviewed target suggestions
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: candidateId
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          description: Line-item candidate list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineCandidateResponse'
        '401':
          description: Not authenticated
  /api/v1/documents/{documentId}/canonical-fields:
    get:
      tags:
      - Review
      summary: List canonical rows and durable field decisions for a document
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Canonical field list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalFieldResponse'
        '401':
          description: Not authenticated
    post:
      tags:
      - Review
      summary: Promote, edit, or replace a canonical field
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalFieldWrite'
      responses:
        '200':
          description: Canonical field updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalField'
        '409':
          description: Canonical revision changed or a human-reviewed fact requires
            an explicit revision
        '422':
          description: Invalid typed correction value
        '401':
          description: Not authenticated
  /api/v1/assets/{assetId}:
    get:
      tags:
      - Assets
      summary: Fetch a protected asset through API authorization
      parameters:
      - in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Asset bytes or a short-lived proxied response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
        '404':
          description: Asset not found
  /api/v1/folders:
    get:
      tags:
      - Organization
      summary: List folders and smart folders
      responses:
        '200':
          description: Folder list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
        '401':
          description: Not authenticated
    post:
      tags:
      - Organization
      summary: Create a folder or smart folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderWrite'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '401':
          description: Not authenticated
  /api/v1/tags:
    get:
      tags:
      - Organization
      summary: List tags
      responses:
        '200':
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          description: Not authenticated
    post:
      tags:
      - Organization
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagWrite'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          description: Not authenticated
  /api/v1/documents/{documentId}/organization:
    post:
      tags:
      - Organization
      summary: Update document folders, primary folder, tags, title, or notes
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentOrganizationWrite'
      responses:
        '200':
          description: Document organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '401':
          description: Not authenticated
  /api/v1/relationships:
    get:
      tags:
      - Relationships
      summary: List document relationships
      parameters:
      - in: query
        name: documentId
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
