      responses:
        '200':
          description: Versioned line authority response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineDecisionResponse'
        '401':
          description: Not authenticated
        '403':
          description: Permission denied
        '404':
          description: Document not found
        '409':
          description: Reload exact source and target authority
        '422':
          description: Invalid request or incomplete evidence
  /api/v1/documents/{documentId}/line-item-history:
    get:
      tags:
      - Review
      summary: Read immutable line decision history; exactly one source or canonical selector is required
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: canonicalLineItemId
        schema:
          type: string
          format: uuid
      - in: query
        name: sourceCandidateId
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
