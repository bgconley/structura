    DocumentBrowseCounts:
      type: object
      additionalProperties: false
      description: Overlapping authorized counts after query, family, review-status, folder and saved-query constraints, before the selected inboxState. These counts must not be summed.
      required: [all, needsReview, unfiled, awaitingClassification, duplicates, lowConfidence, hasExtraction, textSearchable, previewReady, humanReviewed]
      properties:
        all:
          type: integer
          minimum: 0
        needsReview:
          type: integer
          minimum: 0
          description: Document needs_review state or an open/in_progress review task.
        unfiled:
          type: integer
          minimum: 0
          description: No manual-folder membership.
        awaitingClassification:
          type: integer
          minimum: 0
          description: Generic family with no recorded current model classification or explicit human reclassification decision. A classified generic document is excluded.
        duplicates:
          type: integer
          minimum: 0
          description: At least one independently readable exact-duplicate counterpart or suggested/confirmed duplicate_of relationship in either direction.
        lowConfidence:
          type: integer
          minimum: 0
          description: Recorded model classification with known family confidence below 0.7 and no explicit human reclassification decision. NULL confidence is not classified as low.
        hasExtraction:
          type: integer
          minimum: 0
          description: Nonempty current completed/accepted non-classification extraction output. This does not establish accepted canonical facts and excludes native candidate staging.
        textSearchable:
          type: integer
          minimum: 0
          description: Nonempty published lexical chunk projection. This does not establish semantic/visual index readiness or complete source coverage.
        previewReady:
          type: integer
          minimum: 0
          description: A current thumbnail artifact is registered.
        humanReviewed:
          type: integer
          minimum: 0
          description: Document review status is user_confirmed or user_corrected; this does not establish a human classification decision.
