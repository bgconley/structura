  /api/v1/documents/{documentId}/line-item-decisions:
    post:
      tags:
      - Review
      summary: Explicitly add, replace, or reject an exact line proposal or selected slot
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
