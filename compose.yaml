      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "workers.model_placeholder", "--name", "model-granite-placeholder", "--host", "0.0.0.0", "--port", "8101"]
    ports:
      - "${STRUCTURA_MODEL_PLACEHOLDER_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_GRANITE_PORT:-8101}:8101"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      NVIDIA_VISIBLE_DEVICES: ${STRUCTURA_MODEL_GRANITE_GPU:-1}
    profiles: ["models-placeholder", "models"]

  model-embed-placeholder:
