x-live-model-runtime: &live-model-runtime
  ipc: host
  shm_size: ${STRUCTURA_MODEL_SHM_SIZE:-8gb}
  ulimits:
    memlock: -1
    stack: 67108864

x-app-runtime-access: &app-runtime-access
  group_add:
    - "${STRUCTURA_RUNTIME_HOST_GID:-1000}"

services:
  postgres:
    image: ${STRUCTURA_POSTGRES_IMAGE:-paradedb/paradedb:0.21.5-pg17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-structura}
      POSTGRES_USER: ${POSTGRES_USER:-structura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-structura}
    ports:
      - "${STRUCTURA_POSTGRES_BIND_HOST:-127.0.0.1}:${STRUCTURA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *app-runtime-access
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      STRUCTURA_ENV: ${STRUCTURA_ENV:-production}
      STRUCTURA_DATABASE_URL: postgresql://${POSTGRES_USER:-structura}:${POSTGRES_PASSWORD:-structura}@postgres:5432/${POSTGRES_DB:-structura}
      STRUCTURA_RUNTIME_ROOT: /srv/structura
      STRUCTURA_EMBEDDING_TEXT_ENABLED: ${STRUCTURA_EMBEDDING_TEXT_ENABLED:-true}
      STRUCTURA_WATCHED_FOLDER_ROOT: /srv/structura/imports
      STRUCTURA_CONTRACTS_DIR: /app/contracts
      STRUCTURA_DATABASE_DIR: /app/database
      STRUCTURA_MODEL_MODE: ${STRUCTURA_MODEL_MODE:-fixture}
      STRUCTURA_MODEL_QWEN_SEMANTIC_URL: http://model-qwen-semantic:8104
      STRUCTURA_MODEL_GRANITE_URL: http://model-granite:8101
      STRUCTURA_GRANITE_VISUAL_INPUT_MODE: ${STRUCTURA_GRANITE_VISUAL_INPUT_MODE:-shadow_full_page}
      STRUCTURA_MODEL_TEXT_EMBED_URL: http://model-embed:8102
      STRUCTURA_MODEL_VISUAL_EMBED_URL: http://model-vl-embed:8103
      STRUCTURA_TEXT_LANE_TABLES: ${STRUCTURA_TEXT_LANE_TABLES:-true}
      STRUCTURA_TEXT_LANE_KVP: ${STRUCTURA_TEXT_LANE_KVP:-true}
      STRUCTURA_DETERMINISTIC_PLANNER: ${STRUCTURA_DETERMINISTIC_PLANNER:-true}
    ports:
      - "${STRUCTURA_API_BIND_HOST:-127.0.0.1}:${STRUCTURA_API_PORT:-8000}:8000"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/config/api:/srv/structura/config/api
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/objects/canonical:/srv/structura/objects/canonical
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/objects/derived:/srv/structura/objects/derived
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/objects/exports:/srv/structura/objects/exports
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/cache:/srv/structura/cache
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/api:/srv/structura/logs/api
      - ${STRUCTURA_WATCHED_FOLDER_ROOT:-/srv/structura/imports}:/srv/structura/imports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_STRUCTURA_API_BASE_URL: ${VITE_STRUCTURA_API_BASE_URL:-}
    environment:
      STRUCTURA_API_UPSTREAM: ${STRUCTURA_API_UPSTREAM:-http://api:8000}
    ports:
      - "${STRUCTURA_WEB_BIND_HOST:-127.0.0.1}:${STRUCTURA_WEB_PORT:-3000}:3000"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/config/web:/srv/structura/config/web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-ingest:
    <<: *app-runtime-access
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "workers.ingest.worker", "--worker", "worker-ingest", "--health-port", "8201"]
    environment:
      STRUCTURA_DATABASE_URL: postgresql://${POSTGRES_USER:-structura}:${POSTGRES_PASSWORD:-structura}@postgres:5432/${POSTGRES_DB:-structura}
      STRUCTURA_RUNTIME_ROOT: /srv/structura
      STRUCTURA_EMBEDDING_TEXT_ENABLED: ${STRUCTURA_EMBEDDING_TEXT_ENABLED:-true}
      STRUCTURA_WATCHED_FOLDER_ROOT: /srv/structura/imports
      HF_HOME: /srv/structura/cache/huggingface
      XDG_CACHE_HOME: /srv/structura/cache/xdg
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/staging:/srv/structura/staging
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/objects/canonical:/srv/structura/objects/canonical
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/workers:/srv/structura/logs/workers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8201/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-previews:
    <<: *app-runtime-access
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "workers.previews.worker", "--worker", "worker-previews", "--health-port", "8202"]
    environment:
