      - "${STRUCTURA_MODEL_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_EMBED_PORT:-8102}:8102"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      NVIDIA_VISIBLE_DEVICES: ${STRUCTURA_MODEL_EMBED_GPU:-1}
    profiles: ["models"]

  redis:
    image: redis:7-alpine
    ports:
      - "${STRUCTURA_REDIS_BIND_HOST:-127.0.0.1}:${STRUCTURA_REDIS_PORT:-6379}:6379"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/redis:/data
    profiles: ["redis-fallback"]
