      STRUCTURA_MODEL_QWEN_SEMANTIC_URL: http://model-qwen-semantic:8104
      STRUCTURA_MODEL_GRANITE_URL: http://model-granite:8101
      STRUCTURA_GRANITE_VISUAL_INPUT_MODE: ${STRUCTURA_GRANITE_VISUAL_INPUT_MODE:-shadow_full_page}
      STRUCTURA_TEXT_LANE_TABLES: ${STRUCTURA_TEXT_LANE_TABLES:-true}
      STRUCTURA_TEXT_LANE_KVP: ${STRUCTURA_TEXT_LANE_KVP:-true}
