  model-qwen:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "workers.model_placeholder", "--name", "model-qwen", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "${STRUCTURA_MODEL_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_QWEN_PORT:-8100}:8100"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      NVIDIA_VISIBLE_DEVICES: ${STRUCTURA_MODEL_QWEN_GPU:-0}
