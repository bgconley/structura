    profiles: ["models-placeholder", "models"]

  model-qwen-semantic:
    <<: *live-model-runtime
    image: ${STRUCTURA_MODEL_QWEN_SEMANTIC_IMAGE:-voipmonitor/vllm:cu130}
    entrypoint: ["/bin/bash"]
    command: ["/srv/structura/model_services/start_qwen_vllm.sh"]
    ports:
      - "${STRUCTURA_MODEL_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_QWEN_SEMANTIC_PORT:-8104}:8104"
    volumes:
      - ./workers/model_services:/srv/structura/model_services:ro
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/tmp/model-inputs:/srv/structura/tmp/model-inputs
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      STRUCTURA_CUDA_VISIBLE_DEVICES: "0"
      STRUCTURA_MODEL_PROFILE: ${STRUCTURA_QWEN_SEMANTIC_PROFILE:-qwen3-vl-8b-fp8-semantic:v1}
      STRUCTURA_VLLM_MODEL_ID: Qwen/Qwen3-VL-8B-Instruct-FP8
      STRUCTURA_VLLM_SERVED_MODEL_NAME: Qwen/Qwen3-VL-8B-Instruct-FP8
      STRUCTURA_VLLM_PORT: "8104"
      STRUCTURA_VLLM_MAX_MODEL_LEN: "32768"
      STRUCTURA_VLLM_GPU_MEMORY_UTILIZATION: "0.88"
      STRUCTURA_VLLM_KV_CACHE_DTYPE: fp8
      STRUCTURA_VLLM_MAX_NUM_SEQS: "1"
      STRUCTURA_VLLM_MM_PROCESSOR_CACHE_GB: "0"
      STRUCTURA_VLLM_LIMIT_MM_PER_PROMPT: '{"image":4,"video":0}'
      STRUCTURA_VLLM_MM_PROCESSOR_KWARGS: '{"size":{"shortest_edge":262144,"longest_edge":2621440}}'
      STRUCTURA_VLLM_DISABLE_PREFIX_CACHING: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STRUCTURA_MODEL_QWEN_SEMANTIC_GPU:-0}"]
              capabilities: [gpu]
    profiles: ["models-live", "qwen-semantic-live"]

  model-granite:
    <<: *live-model-runtime
    image: ${STRUCTURA_MODEL_GRANITE_IMAGE:-voipmonitor/vllm:cu130}
    entrypoint: ["/bin/bash"]
    command: ["/srv/structura/model_services/start_granite_vllm.sh"]
    ports:
      - "${STRUCTURA_MODEL_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_GRANITE_PORT:-8101}:8101"
    volumes:
      - ./workers/model_services:/srv/structura/model_services:ro
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/tmp/model-inputs:/srv/structura/tmp/model-inputs
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      STRUCTURA_CUDA_VISIBLE_DEVICES: "0"
      STRUCTURA_MODEL_PROFILE: ${STRUCTURA_GRANITE_PROFILE:-granite-4.0-3b-vision-bf16:v1}
      STRUCTURA_GRANITE_MODEL_ID: ibm-granite/granite-4.0-3b-vision
      STRUCTURA_GRANITE_ADAPTER_PATH: ibm-granite/granite-4.0-3b-vision
      STRUCTURA_GRANITE_PORT: "8101"
      STRUCTURA_GRANITE_MAX_MODEL_LEN: "16384"
      STRUCTURA_GRANITE_GPU_MEMORY_UTILIZATION: "0.50"
      STRUCTURA_GRANITE_MAX_NUM_SEQS: "4"
      STRUCTURA_GRANITE_LIMIT_MM_PER_PROMPT: '{"image":1,"video":0}'
      STRUCTURA_GRANITE_DISABLE_PREFIX_CACHING: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STRUCTURA_MODEL_GRANITE_GPU:-1}"]
              capabilities: [gpu]
    profiles: ["models-live", "granite-live"]

  model-embed:
    <<: *live-model-runtime
    image: ${STRUCTURA_MODEL_EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}
    entrypoint: ["/bin/bash"]
    command: ["/srv/structura/model_services/start_text_embed.sh"]
    ports:
      - "${STRUCTURA_MODEL_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_EMBED_PORT:-8102}:8102"
    volumes:
      - ./workers/model_services:/srv/structura/model_services:ro
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      STRUCTURA_CUDA_VISIBLE_DEVICES: "0"
      STRUCTURA_MODEL_PROFILE: ${STRUCTURA_TEXT_EMBED_PROFILE:-qwen3-embedding-4b-1536:v1}
      MODEL_ID: Qwen/Qwen3-Embedding-4B
      SERVED_MODEL_NAME: Qwen/Qwen3-Embedding-4B
      PORT: "8102"
      DTYPE: float16
      HF_HUB_DISABLE_XET: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STRUCTURA_MODEL_EMBED_GPU:-1}"]
              capabilities: [gpu]
    profiles: ["text-embed-live"]

  model-vl-embed:
    <<: *live-model-runtime
    image: ${STRUCTURA_MODEL_VISUAL_EMBED_IMAGE:-voipmonitor/vllm:cu130}
    entrypoint: ["/bin/bash"]
    command: ["/srv/structura/model_services/start_visual_embed_vllm.sh"]
    ports:
      - "${STRUCTURA_MODEL_BIND_HOST:-127.0.0.1}:${STRUCTURA_MODEL_VISUAL_EMBED_PORT:-8103}:8103"
    volumes:
      - ./workers/model_services:/srv/structura/model_services:ro
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/models:/srv/structura/models
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/tmp/model-inputs:/srv/structura/tmp/model-inputs
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/models:/srv/structura/logs/models
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      STRUCTURA_CUDA_VISIBLE_DEVICES: "0"
      STRUCTURA_MODEL_PROFILE: ${STRUCTURA_VISUAL_EMBED_PROFILE:-qwen3-vl-embedding-2b-2048:v1}
      STRUCTURA_VLLM_MODEL_ID: Qwen/Qwen3-VL-Embedding-2B
      STRUCTURA_VLLM_SERVED_MODEL_NAME: Qwen/Qwen3-VL-Embedding-2B
      STRUCTURA_VLLM_PORT: "8103"
      STRUCTURA_VLLM_DTYPE: bfloat16
      STRUCTURA_VLLM_MAX_MODEL_LEN: "2048"
      STRUCTURA_VLLM_GPU_MEMORY_UTILIZATION: "0.45"
      STRUCTURA_VLLM_MAX_NUM_SEQS: "1"
      STRUCTURA_VLLM_MM_PROCESSOR_CACHE_GB: "0"
      STRUCTURA_VLLM_LIMIT_MM_PER_PROMPT: '{"image":1,"video":0}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STRUCTURA_MODEL_VISUAL_EMBED_GPU:-1}"]
              capabilities: [gpu]
    profiles: ["models-live", "visual-embed-live"]

  redis:
    image: redis:7-alpine
    ports:
      - "${STRUCTURA_REDIS_BIND_HOST:-127.0.0.1}:${STRUCTURA_REDIS_PORT:-6379}:6379"
    volumes:
      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/redis:/data
    profiles: ["redis-fallback"]
