      - ${STRUCTURA_RUNTIME_ROOT:-/srv/structura}/logs/workers:/srv/structura/logs/workers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8203/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-extraction:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "workers.extraction.worker", "--worker", "worker-extraction", "--health-port", "8204"]
    environment:
